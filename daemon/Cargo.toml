[package]
name = "validator-signer-daemon"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The Ethereum remote-signing API in front of the validator signer on a Ledger device"
publish = false

[dependencies]
bls12_381 = { version = "0.8.0", features = ["experimental"] }
hex = "0.4.3"
sha2 = "0.9.9"
serde_json = "1.0.133"
tiny_http = "0.12.0"

[profile.release]
panic = "abort"
